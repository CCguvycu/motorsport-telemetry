services:
  - type: web
    name: motorsport-telemetry
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn ui:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NTFY_TOPIC
        generateValue: false
